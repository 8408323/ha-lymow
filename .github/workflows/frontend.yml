name: Frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Every UI string is translated
        run: npm run i18n:check

      - name: Type-check and build
        run: npm run build

      # The built bundle is committed (HACS installs straight from the repo), so it
      # must match the source.
      - name: Committed bundle is up to date
        run: git diff --exit-code -- ../custom_components/lymow/www/ || (echo "::error::Run 'npm run build' in frontend/ and commit custom_components/lymow/www/" && exit 1)
